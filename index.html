<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arbitrage Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>Arbitrage Dashboard</h1>
            <p>Market Data &amp; Analysis</p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="status">Online</span>
        </div>
    </header>

    <main>

        <section class="card">
            <h2>Data Fetch Test</h2>

            <p>
                Diese Seite ist aktuell mit GitHub Pages verbunden.
                Als Nächstes testen wir hier das Abrufen externer Marktdaten.
            </p>

            <button id="fetchButton">
                Daten abrufen
            </button>

            <div id="output" class="output">
                Noch keine Daten geladen.
            </div>
        </section>

        <section class="card">
            <h2>Market Data</h2>

            <div class="data-grid">

                <div class="data-item">
                    <span class="label">Asset</span>
                    <span id="asset" class="value">---</span>
                </div>

                <div class="data-item">
                    <span class="label">Price</span>
                    <span id="price" class="value">---</span>
                </div>

                <div class="data-item">
                    <span class="label">Timestamp</span>
                    <span id="timestamp" class="value">---</span>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>Arbitrage Analysis Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arbitrage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <h1>Arbitrage</h1>
    <p>Market Data Dashboard</p>

    <div class="status">
        <strong>Status:</strong>
        <span id="status">Website läuft.</span>
    </div>

    <button id="testButton">
        Test
    </button>

    <div id="output">
        Noch keine Daten geladen.
    </div>

    <script>
        const button = document.getElementById("testButton");
        const output = document.getElementById("output");

        button.addEventListener("click", () => {
            output.textContent = "JavaScript funktioniert!";
        });
    </script>

</body>
</html>
